[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hawkeslob"
version = "0.1.0"
description = "Univariate exponential Hawkes processes: simulation, MLE, goodness-of-fit, LOB trade-arrival study"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Hemang" }]
keywords = ["hawkes", "point-process", "limit-order-book", "market-microstructure"]
dependencies = ["numpy>=1.26", "scipy>=1.11", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
hawkeslob = "hawkeslob.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hawkeslob"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
